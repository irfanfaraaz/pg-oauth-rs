[package]
name = "itest"
version = "0.0.0"
edition = "2021"
publish = false
description = "Integration tests for pg-oauth-rs against the demo stack (run via demo/run-itests.sh)"

# An empty workspace of its own: this crate is not part of the root pgrx crate's build.
# It only builds inside the compose test runner (demo/Dockerfile.itest), which has libpq 18.
[workspace]

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
rsa = "0.9"
serde_json = "1"
ureq = { version = "3", features = ["json", "platform-verifier"] }
