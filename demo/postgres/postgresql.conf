# Demo server config. Everything not set here keeps the PostgreSQL default.
listen_addresses = '*'
hba_file = '/etc/pg-oauth-rs/pg_hba.conf'
ident_file = '/etc/pg-oauth-rs/pg_ident.conf'
log_connections = on

oauth_validator_libraries = 'pg_oauth_rs'
pg_oauth_rs.audience = 'postgres'
pg_oauth_rs.jwks_uri = 'https://keycloak.localtest.me:8443/realms/demo/protocol/openid-connect/certs'
pg_oauth_rs.identity_claim = 'email'
