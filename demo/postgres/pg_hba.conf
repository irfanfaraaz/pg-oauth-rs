# TYPE  DATABASE  USER      ADDRESS  METHOD
# Inside the container (init scripts, docker exec): no password.
local   all       all                trust
# Admin and integration tests: password from POSTGRES_PASSWORD in compose.yaml (demo only).
host    all       postgres  all      scram-sha-256
# Everyone else logs in with an OAuth token from the demo Keycloak realm.
host    all       all       all      oauth issuer="https://keycloak.localtest.me:8443/realms/demo" scope="openid" map=oauth
