name: Release

# A version tag (v0.1.0) publishes a GitHub Release (tarballs, SHA256SUMS, release notes from
# CHANGELOG.md) and the Docker image ghcr.io/<owner>/pg-oauth-rs. Every artifact gets a signed
# build-provenance attestation. On a pull request that touches packaging, the same builds run as a
# dry run: nothing is pushed or published.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - demo/Dockerfile.postgres

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Read the version; on a tag, it must match Cargo.toml and CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$PUBLISH" = true ]; then
            test "${REF_NAME#v}" = "$version" || { echo "tag $REF_NAME != Cargo.toml $version"; exit 1; }
            grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$version] section"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  tarball:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built on Debian 12 (bookworm) for its older glibc, so the library also loads on
      # Debian 12+ and Ubuntu 24.04+. Same PostgreSQL 18.6 headers as the Docker image.
      - name: Build the module
        run: |
          docker run --rm -v "$PWD:/src" -w /src postgres:18.6-bookworm \
            sh -c 'sh packaging/build-module.sh deps && sh packaging/build-module.sh build /src/dist/pkg'
      - name: Pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          name="pg_oauth_rs-${VERSION}-pg18-linux-${ARCH}.tar.gz"
          tar -C dist/pkg --owner=0 --group=0 -czf "$name" usr
          tar -tzvf "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.arch }}
          path: pg_oauth_rs-*.tar.gz
          if-no-files-found: error

  image:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pg-oauth-rs" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=pg-oauth-rs
            org.opencontainers.image.description=PostgreSQL 18 with the pg-oauth-rs OAuth validator module installed
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      # One native build per architecture, pushed by digest only; `image-manifest` tags them together.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile.postgres
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      - name: Save the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  image-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pg-oauth-rs" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        name: Tag both architectures under one name
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tag_list <<< "$TAGS"
          args=()
          for t in "${tag_list[@]}"; do args+=(-t "$t"); done
          for d in digests/*; do args+=("$IMAGE@sha256:${d#digests/}"); done
          docker buildx imagetools create "${args[@]}"
          digest=$(docker buildx imagetools inspect "${tag_list[0]}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, tarball, image-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          # The CHANGELOG section for this version: without its heading, the next section, or the
          # link definitions at the end of the file.
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 {on = 1; next}
            /^## \[/ || /^\[[^]]*\]: / {on = 0}
            on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
