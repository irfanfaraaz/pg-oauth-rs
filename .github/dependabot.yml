# Monthly, one grouped PR per ecosystem, to keep the noise down. Security updates are separate
# (repository settings) and still arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns: ["*"]
  # The Keycloak image is pinned in compose.yaml, which the "docker" ecosystem does not read.
  - package-ecosystem: "docker-compose"
    directory: "/demo"
    schedule:
      interval: "monthly"
    groups:
      docker-compose:
        patterns: ["*"]
