version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "weekly"
  # The Keycloak image is pinned in compose.yaml, which the "docker" ecosystem does not read.
  - package-ecosystem: "docker-compose"
    directory: "/demo"
    schedule:
      interval: "weekly"
