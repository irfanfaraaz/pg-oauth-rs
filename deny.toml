# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# The crate itself is MIT OR Apache-2.0; every dependency must be under one of these.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Marvin: timing leak in RSA *decryption*. jsonwebtoken only verifies signatures with public
    # keys, so no private-key operation exists to leak. No fixed rsa release yet.
    { id = "RUSTSEC-2023-0071", reason = "no RSA decryption or private-key use in this crate" },
    # serde_cbor is unmaintained. It comes only through the pgrx-tests dev-dependency.
    { id = "RUSTSEC-2021-0127", reason = "test-only dependency of pgrx-tests" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
